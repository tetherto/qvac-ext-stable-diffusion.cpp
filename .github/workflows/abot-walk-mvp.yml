name: ABot-World walk MVP

# Builds the engine, runs the native DiT-only fixed-scene walk, records the
# result mp4 as an artifact, and validates it against the committed reference.
#
# STATUS: scaffold. Fill MODEL_BASE_URL with the corp S3 prefix once available,
# and enable the `run-walk` job when the denoise core (examples/abot-walk) lands
# (see docs/abot_world_mvp_spec.md). The `build` job is active now.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "examples/abot-walk/**"
      - ".github/workflows/abot-walk-mvp.yml"

env:
  # TODO: set to the corp S3 prefix holding the MVP model files
  #   abot-world-0-5b-lf-dit-q8_0.gguf, taew2_2.gguf, scenes/coastal/*
  MODEL_BASE_URL: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sd-bin
          path: build/bin/

  run-walk:
    needs: build
    runs-on: ubuntu-22.04
    # Enable once examples/abot-walk exists and MODEL_BASE_URL is set.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sd-bin, path: build/bin }
      - run: chmod +x build/bin/*
      - name: Fetch model files (corp S3)
        run: |
          set -euo pipefail
          mkdir -p models scenes/coastal
          for f in abot-world-0-5b-lf-dit-q8_0.gguf taew2_2.gguf; do
            curl -fSL "$MODEL_BASE_URL/$f" -o "models/$f"
          done
          for f in scene.safetensors scene.json walk.json \
                   noise_block0.npy noise_block1.npy noise_block2.npy noise_block3.npy; do
            curl -fSL "$MODEL_BASE_URL/scenes/coastal/$f" -o "scenes/coastal/$f"
          done
      - name: Walk (record mp4)
        run: |
          build/bin/sd-abot-walk \
            --diffusion-model models/abot-world-0-5b-lf-dit-q8_0.gguf \
            --taehv models/taew2_2.gguf \
            --scene scenes/coastal \
            --actions "idle:1,W:3" \
            --dump-latents out/latents \
            --out out/walk.mp4
      - name: Validate walk vs reference
        run: |
          # committed reference frames/latents live in test/data/abot_golden/
          python3 script/compare_walk.py \
            --got out --ref test/data/abot_golden \
            --min-latent-cosine 0.999 --min-frame-psnr 30
      - name: Upload walk mp4
        uses: actions/upload-artifact@v4
        with: { name: abot-walk-mp4, path: out/walk.mp4 }
